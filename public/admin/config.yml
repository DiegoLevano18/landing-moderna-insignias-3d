# Panel de administración (Sveltia CMS). Guarda el contenido como archivos en el repositorio;
# cada publicación dispara el despliegue automático del sitio.
backend:
  name: github
  repo: diegolevano18/landing-moderna-insignias-3d
  branch: ccr-d91dc238-fafrax
  commit_messages:
    create: 'Contenido: crear {{collection}} "{{slug}}"'
    update: 'Contenido: actualizar {{collection}} "{{slug}}"'
    delete: 'Contenido: eliminar {{collection}} "{{slug}}"'
    uploadMedia: 'Contenido: subir {{path}}'
    deleteMedia: 'Contenido: eliminar {{path}}'

locale: es
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    label_singular: Artículo
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    fields:
      - { name: title, label: Título, widget: string, hint: Máximo 70 caracteres }
      - { name: description, label: Descripción para buscadores, widget: text, hint: Máximo 170 caracteres }
      - { name: date, label: Fecha, widget: datetime, time_format: false }
      - { name: cover, label: Imagen de portada, widget: image, required: false }
      - { name: draft, label: Borrador (no se publica), widget: boolean, default: false }
      - { name: body, label: Contenido, widget: markdown }

  - name: productos
    label: Productos
    label_singular: Producto
    folder: src/content/productos
    create: true
    slug: '{{slug}}'
    extension: md
    fields:
      - { name: title, label: Nombre, widget: string }
      - { name: description, label: Descripción corta, widget: text }
      - { name: price, label: Precio, widget: number, value_type: float, min: 0 }
      - { name: currency, label: Moneda, widget: select, options: [PEN, USD], default: PEN }
      - { name: images, label: Fotos, widget: image, multiple: true, required: false }
      - { name: acabado, label: Acabado, widget: string, required: false }
      - { name: stock, label: Stock, widget: number, value_type: int, min: 0, default: 0 }
      - { name: published, label: Publicado, widget: boolean, default: false }
      - { name: body, label: Detalle, widget: markdown, required: false }

  - name: acabados
    label: Acabados
    label_singular: Acabado
    folder: src/content/acabados
    create: false
    extension: md
    fields:
      - { name: title, label: Nombre, widget: string }
      - { name: resumen, label: Resumen, widget: text }
      - { name: familia, label: Familia, widget: select, options: [TPU, Textil, Especial] }
      - { name: textura, label: Textura visual, widget: select, options: [tpu3d, tpu2d, flock, holo, tatami, bordado, cuero, chenille] }
      - { name: ideal, label: Ideal para, widget: list }
      - { name: orden, label: Orden, widget: number, value_type: int }
      - { name: body, label: Explicación, widget: markdown }
